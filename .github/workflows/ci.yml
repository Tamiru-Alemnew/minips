name: ci

on: [push, pull_request]

jobs:
  go:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: "1.24", cache-dependency-path: server/go.sum}
      - name: gofmt
        run: test -z "$(gofmt -l server)"
      - name: vet and race tests
        run: cd server && go vet ./... && go test -race ./...

  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: "1.24", cache-dependency-path: server/go.sum}
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - name: install
        run: pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt
      - name: lint
        run: ruff check worker experiments baselines tests
      - name: unit and two-worker integration tests
        run: make test-py
      - name: all-reduce baseline smoke run
        run: python baselines/allreduce.py --config tests/configs/tiny.yaml --out /tmp/allreduce.json

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
