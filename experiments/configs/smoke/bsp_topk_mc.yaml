name: bsp_topk_mc
workers: 4
epochs: 8
batch_size: 128
lr: 0.4
warmup_epochs: 1
momentum: 0.0
weight_decay: 0.0005
model:
  name: resnet18
  width: 16
data:
  source: folder
  root: data/cifar10-jpg
  train_size: 20000
threads_per_worker: 1
bn_batches: 20
curve_test_size: 2000
system: ps
ps:
  mode: bsp
  shards: 4
compression:
  kind: topk
  ratio: 0.01
  momentum_correction: 0.9
