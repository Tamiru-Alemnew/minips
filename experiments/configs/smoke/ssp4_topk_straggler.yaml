name: ssp4_topk_straggler
workers: 8
epochs: 8
batch_size: 128
lr: 0.4
warmup_epochs: 1
momentum: 0.9
weight_decay: 0.0005
model:
  name: resnet18
  width: 16
data:
  source: folder
  root: data/cifar10-jpg
  train_size: 20000
threads_per_worker: 1
bn_batches: 20
curve_test_size: 2000
system: ps
ps:
  mode: ssp
  staleness: 4
  shards: 4
compression:
  kind: topk
  ratio: 0.01
straggler:
  worker: 7
  slowdown: 0.5
