name: ssp4_topk
workers: 8
epochs: 30
batch_size: 128
lr: 0.4
warmup_epochs: 2
momentum: 0.9
weight_decay: 0.0005
model:
  name: resnet18
  width: 64
data:
  source: torchvision
  root: data
threads_per_worker: 1
bn_batches: 50
curve_test_size: 2000
system: ps
ps:
  mode: ssp
  staleness: 4
  shards: 4
compression:
  kind: topk
  ratio: 0.01
